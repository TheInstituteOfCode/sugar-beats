{% comment %} IMPORTANT THESE PADDING & TEXT SIZE CLASSES ARE CAREFULLY BALANCED TOGETHER, CHANGING ONE CAN BREAK THE REST {% endcomment %}
<section class="bg-yellow text-white py-[20%] px-[10%] sm:px-[20vw] sm:py-[10vw] lg:px-[30vw] lg:py-[10vw]">
        <div class="mx-auto">
            <h2 class="text-[10vw] sm:text-[7.5vw] lg:text-[5vw] -mx-1 heading-caps z-20 text-center mx-auto editable">
                {{block.heading-top}}
            </h2>
            <div class="aspect-square relative overflow-hidden mx-auto">
                <video class="absolute top-0 left-0 h-full w-full object-cover z-10" autoplay muted loop>
                    <source src="{{block.video}}" type="video/{{block.video-type}}" />
                </video>

            </div>
            <h3 class="text-[7vw] sm:text-[5.5vw] lg:text-[3.7vw] -mx-1 mt-3 heading-caps text-center editable">
                {{block.heading-bottom}}
            </h3>
        </div>
</section>


<section class="bg-contain bg-repeat-x bg-bottom py-[10vh] md:pt-[20vh] md:pb-[50vh] style-{{block.style}}" style="background-image: url('{{block.bg-image}}');">
    <div class="max-w-screen-xl mx-auto">
    <h2 class="text-lg text-center">
        {{block.heading}}
    </h2>
    <form name="weddings-and-events" method="POST" data-netlify="true" class="flex flex-col justify-center max-w-screen-sm gap-4 mx-auto">
        <input type="text" placeholder="Name" name="Name" class="border-2  p-4" />
        <input type="email" placeholder="Email" name="Email" class="border-2  p-4" />
        <input type="tel" placeholder="Phone" name="Phone" class="border-2  p-4" />
        <input type="text" placeholder="Type of Enquiry" name="Enquiry type" class="border-2  p-4" />
        <textarea name="message" placeholder="Message" class="border-2 p-4"></textarea>
        <button type="submit" class="button-rounded mx-auto">Submit</button>

    </form>
    </div>
</section>

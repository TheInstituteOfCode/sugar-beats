
<section class="bg-blue text-cream px-0">
    <div class="max-w-screen-xl mx-auto p-[5%]">
        <div class="flex justify-between items-center">
            <h2 class="text-lg heading-caps">
                {{block.heading}}
            </h2>
            <p class="text-tiny md:text-base sub-heading text-right">
                {{block.text}}
            </p>
        </div>
    </div>
    <div>
        <div class="flex flex-nowrap overflow-x-scroll gap-8 px-[var(--side-gap)]">
            {% for item in block.cards %}
            <a href="{{item.url}}" class="rounded-3xl overflow-hidden bg-cream text-blue shrink-0 w-4/5 sm:w-2/5 lg:w-1/4">
                <div class="relative overflow-hidden aspect-square round-t-3xl">
                    <img class="absolute inset-0 h-full w-full object-cover" src="{{item.image}}" alt="{{image.alt}}" />
                </div>
                <div class="p-4">
                    <h3 class="sub-heading text-tiny md:text-base">
                        {{item.sub-heading}}
                    </h3>
                    <h3 class="text-sm md:text-md">{{item.heading}}</h3>
                    <p class="text-tiny md:text-base">
                        {{item.description}}
                    </p>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>  
</section>

                              alt: Bright and elegant dining interior at Ocean Kitchen overlooking the tropical surroundings of Bintan
                          - 
                              image: /uploads/ocean-kitchen-5.jpg
                              alt: Couple toasting colorful drinks at beachfront table with palm trees and loungers, Ocean Kitchen Bintan
              - 
                  heading: Stix
                  text: Stix, a 16-seat restaurant &amp; bar where we take the beloved Indonesian satay and infuse it with a modern twist. Using the freshest locally sourced ingredients and traditional techniques we honor the island’s rich culinary heritage while taking inspiration from global cuisine.
                  link: https://drive.google.com/file/d/1NV44w8rZkJ3kbD2vvCHTFGUKabOMcal9/view?usp=drive_link
                  link-text: SEE MENU

          heading_sub: WEDDINGS, BIRTHDAYS &amp; SPECIAL EVENTS
          heading: Celebrations
          block-content: >
              <p class="">
                          From milestone birthdays to anniversaries and special events, Hotel Indigo Bintan is the perfect place to celebrate. Our team can curate the perfect trip for groups big and small - whether you’re looking for a private beachfront dinner &amp; bonfire, a private omakase dinner at Stix or a pool party at SugarBEATS we’ve got you covered.
                      </p>
                      <p>
                      </p>
                      <p class="">
                          And while you’re here, enjoy all the facilities on offer from watersports to a our onsite gym &amp; spa.
                      </p>
                      <a class="button-rounded ">
                              LEARN MORE
                      </a>
                      <p></p>
          gallery:
                  -
                      image: /uploads/event-3.jpg
                      alt: >-
                          Private celebration dinner setup at beachfront SugarBEATS Bintan
                          event venue

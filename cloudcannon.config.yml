          _id: full-height-text-section
          block-content: >
              <h3 class="tiny-heading">
                  AN OCEANFRONT BEACH CLUB IN BINTAN
              </h3>
              <h2 class="heading">
                  SugarBEATS is Bintan’s best beach club, a spot to eat, drink and play and watch the world go past all with a dreamy ocean backdrop.
              </h2>
                  <p class="constrained">Set on one of Bintan’s most stunning stretches of beach, SugarBEATS blends ocean views, curated music, and elevated dining into one unforgettable experience. By day, unwind by the water. By night, let the music move you. </p>
          bg-image: /uploads/palm-trees.jpg
                              alt: Hands sharing colorful Asian dishes and desserts over a wooden dining table, Ocean Kitchen Bintan
                          - 
                              image: /uploads/ocean-kitchen-2.jpg
                              alt: Ocean Kitchen restaurant interior with lounge seating, dining tables and wood ceiling, SugarBEATS Bintan
